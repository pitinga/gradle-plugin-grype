name: Release Gradle Grype Plugin
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: grype-release
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.9.0'
      - id: version
        shell: bash
        run: |
          version=$(sed -n "s/^version = '\([^']*\)'$/\1/p" build.gradle)
          [[ "$version" =~ ^0\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: gradle --no-daemon clean test validatePlugins publishToMavenLocal --warning-mode all
  release:
    needs: verify
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        shell: bash
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$tag"
            test "$(git rev-parse "$tag^{commit}")" = "$GITHUB_SHA"
          else
            git tag -a "$tag" -m "Gradle Grype Plugin $tag"
            git push origin "refs/tags/$tag"
          fi
          gh release create "$tag" --verify-tag --title "Gradle Grype Plugin $tag" --generate-notes
